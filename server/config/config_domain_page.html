<!DOCTYPE html>
<!--
  config_domain_page.html — 域页的静态骨架（服务端不做模板渲染）。

  页面是「壳 + 一张域表 + 一棵配置树」：壳由 config_shell.py 在服务端生成，
  域表由 page_domains.py 以 JSON 注入（见 config_handler.handle_domain_page），
  配置值由浏览器从 api/full 拉。为什么域表走注入而不是页面里硬编码一遍：
  字段归属是服务端已经算过的事实（父 spec §7 的机械复算），在页面里再抄一份
  就是两把尺子；脏计数与渲染都必须数同一张表。

  编辑逻辑在 config_domain_page.js（外部 ES 模块，与 config_state_model.js
  同源），这样它和状态模型一样是可读、可 diff、无内联脚本的单文件。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__SHELL_CSS__</style>
<style>__PAGE_STYLE__</style>
<style>
/* 域页自己的一点样式；骨架与 token 一律来自壳。 */
.hash-flash{animation:hashFlash 1.4s ease}
@keyframes hashFlash{0%{box-shadow:0 0 0 3px rgba(91,140,255,.5)}100%{box-shadow:none}}

/* ---- 引擎库（§5）---- */
.catbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.cattab{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s}
.cattab:hover{color:var(--text);border-color:var(--accent)}
.cattab.on{background:rgba(91,140,255,.16);color:#fff;border-color:var(--accent)}
input.search{width:100%;margin-bottom:8px}
.libnote{color:var(--dim);font-size:12px;margin-bottom:12px}
.libnote b{color:var(--text)}

/* 一条引擎 = 一个 <details>。折叠态字段数 = 0（体是空的，按需填充）。 */
details.engine{border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--panel2)}
details.engine.dirty{border-color:rgba(251,191,36,.45)}
details.engine.live{border-color:rgba(52,211,153,.45)}
details.engine summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:transparent;font-size:13px;color:var(--text)}
details.engine summary::-webkit-details-marker{display:none}
details.engine summary::before{content:'▸';font-size:10px;color:var(--dim);transition:transform .2s}
details.engine[open] summary::before{transform:rotate(90deg)}
details.engine .nm{font-weight:600}
details.engine .ty{color:var(--dim);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
details.engine .nf{color:var(--dim);font-size:11.5px;margin-left:auto}
details.engine .live-tag{color:var(--ok);font-size:11.5px;white-space:nowrap}
details.engine .dirtydot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn);flex-shrink:0}
details.engine .dirtydot[hidden]{display:none}
details.engine .engbody{padding:4px 14px 12px}
details.engine .engbody .row:last-child{border-bottom:0}

/* 跨类目搜索命中的类目标签：没有它，搜出来的 TTS 引擎会被当成 LLM 的（§5.1） */
.catpill{background:rgba(124,92,255,.18);color:#a78bfa;border-radius:8px;padding:1px 8px;font-size:11px;font-weight:700}

/* 上方「当前生效」六行 */
.slot{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(36,48,72,.5)}
.slot:last-child{border-bottom:0}
.slot .cat{width:70px;font-weight:700;font-size:12.5px;letter-spacing:.3px}
.slot .selc{flex:1;max-width:340px}
.slot .meta{color:var(--dim);font-size:11.5px;white-space:nowrap}
details.group.asdetails{background:var(--panel);border:1px solid var(--line);border-radius:16px}
details.group.asdetails summary{background:transparent;font-size:14px;font-weight:600;color:var(--text);padding:18px 24px}
details.group.asdetails>div{padding:0 24px 18px}
.row.dirty .label::after{content:' ●';color:var(--warn);font-size:9px;vertical-align:super}

/* ---- 引擎域：「试连 LLM」的结果面板（§6.2 常规级，零确认）----
   搬自旧八组页面（#31 收线后这里是唯一实现）。 */
.testresult{margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--dim)}
.testresult .kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.testresult .kv span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.testresult .reply{margin-top:10px;padding:10px 12px;background:#0a0e18;border:1px solid var(--line);border-radius:10px;color:var(--text);white-space:pre-wrap}
.testresult .warn{color:var(--warn);margin-top:10px}
.testresult .err{color:var(--err);word-break:break-all}

/* ---- 设备域：运行时面（#29，§4.4）---- */
.runtime-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.runtime-actions:first-child{margin-top:0;margin-bottom:8px}
.runtime-actions input[type=file]{width:auto;max-width:320px}
.runtime-actions input[type=text]{flex:1;min-width:180px}
.runtime-list{padding:4px 0}
.runtime-form{display:flex;flex-direction:column;gap:10px;max-width:520px}
/* 字段级危险标注（§7 移交注记 4）：它与**操作**的三级分级（§6.2，见
   共享外壳的确认层）是两根轴——这里只把「这是危险动作」显出来。 */
.danger-note{margin-top:8px;color:var(--err);font-size:12px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:8px 12px;line-height:1.5}
.row.danger-row .label{color:var(--err)}
</style>
</head>
<body>
__TOPBAR__
<div class="layout">
  <aside class="sidebar" id="sidebar">__SIDEBAR__</aside>
  <main class="content" id="main">
    <div class="pagehead">
      <h1>__PAGE_ICON__ __PAGE_LABEL__</h1>
      <div class="desc" id="pageDesc">__PAGE_DESC__</div>
    </div>
    <div id="domainBody">__BODY__</div>
  </main>
</div>
__SAVEBAR__
<div id="dirtyPanel"></div>
<div id="toast"></div>
__CONFIRM__

<!-- 域表：服务端注入（page_domains.py 的 JSON 形态），页面不硬编码字段归属 -->
<script id="domain-schema" type="application/json">__SCHEMA_JSON__</script>
<!--
  危险分级模型（无 DOM 依赖的纯模块，node 缝跑）。全部域页共用同一份
  分级判定与后果文案（#31 收线后旧八组页面已退役，这里是唯一消费方）。
  由下方 script 的 import 消费，不需再空加载一次。
-->
<!--
  路径写**绝对**前缀，不用 ``./config_domain_page.js``：
  规范 URL 是 ``/xiaozhi/config/<slug>/``（目录形式），相对路径会解析成
  ``/xiaozhi/config/<slug>/config_domain_page.js``，多一级 slug 段。
  脚本与状态模型都在上一层——两页共用同一份，连路径也要表现得像同一份。
-->
<script type="module" src="/xiaozhi/config/config_domain_page.js"></script>
<script>__SHELL_JS__</script>
<script>__PAGE_JS__</script>
</body>
</html>
