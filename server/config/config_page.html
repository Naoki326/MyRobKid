<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小智 · 设备配置</title>
<style>
:root{
  --bg:#0b0f1a; --bg2:#111827; --panel:#141c2e; --panel2:#1a2338; --line:#243048;
  --text:#e6edf7; --dim:#8b98b3; --accent:#5b8cff; --accent2:#7c5cff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  --grad:linear-gradient(135deg,#5b8cff,#7c5cff);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}

/* ---- 顶部状态栏 ---- */
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;background:rgba(11,15,26,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.logo .orb{width:28px;height:28px;border-radius:50%;background:var(--grad);box-shadow:0 0 16px rgba(91,140,255,.5);display:flex;align-items:center;justify-content:center;font-size:14px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.dirty-chip{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:var(--warn);padding:3px 12px;border-radius:20px;font-size:12px;font-weight:600;display:none}
.dirty-chip.show{display:flex;align-items:center;gap:6px}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.3);border-color:var(--accent)}
.btn.primary{background:var(--grad);color:#fff;border:none}
.btn.primary:hover{box-shadow:0 4px 16px rgba(91,140,255,.4)}
.btn.danger{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;border:none}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* ---- 布局 ---- */
.layout{display:flex;padding-top:60px;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;position:fixed;top:60px;bottom:0;left:0;background:var(--bg2);border-right:1px solid var(--line);padding:20px 12px;overflow-y:auto}
.navitem{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--dim);font-size:13px;font-weight:500;margin-bottom:2px;transition:all .2s;position:relative}
.navitem:hover{color:var(--text);background:rgba(91,140,255,.08)}
.navitem.active{color:#fff;background:rgba(91,140,255,.15)}
.navitem.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--grad)}
.navitem .ic{font-size:15px;width:20px;text-align:center}
.content{flex:1;margin-left:220px;padding:28px 32px 120px;max-width:980px}

/* ---- 分组卡片 ---- */
section{display:none;animation:fadeUp .35s ease}
section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.group{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.2);position:relative;overflow:hidden}
.group::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:opacity .3s}
.group:hover::before{opacity:1}
.group h2{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.group h2 .badge{font-size:11px;background:rgba(91,140,255,.15);color:var(--accent);padding:2px 10px;border-radius:12px;font-weight:500}
.group .desc{color:var(--dim);font-size:12px;margin-bottom:18px;line-height:1.5}

/* ---- 表单项 ---- */
.row{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid rgba(36,48,72,.5)}
.row:last-child{border-bottom:0}
.row .meta{width:200px;flex-shrink:0;padding-top:4px}
.row .meta .label{font-size:13px;font-weight:500}
.row .meta .hint{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.4}
.row .ctrl{flex:1;min-width:0}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;font-family:inherit;transition:all .2s}
input:hover,select:hover,textarea:hover{border-color:#2d3a55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
input:disabled{opacity:.5;cursor:not-allowed}
input.masked{color:var(--dim)}
textarea{resize:vertical;min-height:80px;font-family:ui-monospace,Menlo,monospace;line-height:1.6}
select{cursor:pointer}
select option{background:var(--panel2)}

/* 开关样式 */
.switch{position:relative;display:inline-block;width:44px;height:24px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:24px;transition:.25s}
.switch .sl::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--dim);border-radius:50%;transition:.25s}
.switch input:checked+.sl{background:rgba(52,211,153,.25);border-color:var(--ok)}
.switch input:checked+.sl::before{transform:translateX(20px);background:var(--ok)}
.switch-row{display:flex;align-items:center;gap:12px}
.switch-row .sw-label{font-size:13px}

/* 列表编辑 */
.keylist{width:100%}
.keylist .krow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.keylist input{flex:1}
.keylist .del{background:transparent;color:var(--err);border:1px solid rgba(248,113,113,.3);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .2s}
.keylist .del:hover{background:rgba(248,113,113,.15)}
.addbtn{background:transparent;color:var(--accent);border:1px dashed rgba(91,140,255,.4);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:500;transition:all .2s;width:100%}
.addbtn:hover{background:rgba(91,140,255,.1);border-style:solid}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.25);color:var(--accent);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:500;margin-right:6px;margin-bottom:6px}

/* JSON 查看器 */
.jsonbox{background:#0a0e18;border:1px solid var(--line);border-radius:12px;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#7dd3fc;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;line-height:1.6}

/* 测试结果 */
.testresult{margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--dim)}
.testresult .kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.testresult .kv span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.testresult .reply{margin-top:10px;padding:10px 12px;background:#0a0e18;border:1px solid var(--line);border-radius:10px;color:var(--text);white-space:pre-wrap}
.testresult .warn{color:var(--warn);margin-top:10px}
.testresult .err{color:var(--err);word-break:break-all}

/* 折叠面板 */
details{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
details summary{cursor:pointer;color:var(--dim);font-size:12px;padding:10px 14px;background:var(--panel2);list-style:none;display:flex;align-items:center;gap:8px;transition:all .2s}
details summary:hover{color:var(--text)}
details summary::before{content:'▸';font-size:10px;transition:transform .2s}
details[open] summary::before{transform:rotate(90deg)}
details>div{padding:12px 14px}

/* 提示 toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a2338;border:1px solid var(--line);color:#fff;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:99;box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}
#toast.err{border-color:rgba(248,113,113,.4);color:var(--err)}

/* 保存栏 */
.savebar{position:fixed;bottom:0;left:220px;right:0;background:rgba(11,15,26,.9);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:14px 32px;display:flex;gap:12px;align-items:center;z-index:50}
.savebar .info{font-size:12px;color:var(--dim)}

/* 移动端 */
@media(max-width:900px){
  .sidebar{width:64px;padding:16px 8px}
  .navitem{padding:12px;justify-content:center}
  .navitem .lbl{display:none}
  .content{margin-left:64px;padding:20px 16px 120px}
  .savebar{left:64px}
  .row{flex-direction:column;gap:8px}
  .row .meta{width:100%}
  .topbar{padding:0 16px}
  .status{display:none}
}
/* ---- 共享外壳注入：危险分级与统一页内确认层（父 spec §6.4/§6.5）----
   旧八组页面是自包含 HTML，但确认层是**壳级共享资产**（§6.5「共享外壳的一件
   组件」）——服务端在 handle_page 里把同一份 CSS/JS/HTML 注进来，两页不各写
   一遍。分级判定与后果文案来自共用的 config_danger_model.js（ES 模块）。 */
__CONFIRM_CSS__
</style>
</head>
<body>

<!-- 顶部状态栏 -->
<div class="topbar">
  <div class="logo"><div class="orb">🤖</div><span>小智设备配置</span></div>
  <div class="status"><div class="dot"></div><span id="svcStatus">服务运行中</span></div>
  <div class="right">
    <span class="dirty-chip" id="dirtyChip">● <span id="dirtyCount">0</span> 处未保存</span>
    <button class="btn" onclick="location.reload()">🔄 刷新</button>
  </div>
</div>

<div class="layout">
  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar"></aside>
  <!-- 内容区 -->
  <main class="content" id="main"></main>
</div>

<!-- 保存操作栏 -->
<div class="savebar show" id="saveBar">
  <button class="btn primary" id="saveBtn" onclick="saveAll()" disabled>💾 保存修改</button>
  <button class="btn warn" data-danger-op="restart_server" data-danger-level="warning"
    onclick="restartServer()">⚠ ♻️ 重启服务</button>
  <span class="info" id="saveInfo">暂无未保存修改</span>
</div>
<!-- 脏标记明细：按生效性分两组（父 spec §5.4），随选中实时重算 -->
<div id="dirtyPanel" style="position:fixed;bottom:64px;left:220px;right:0;padding:0 32px 8px;font-size:12px;z-index:49"></div>

<div id="toast"></div>
<!-- 统一页内确认层（共享外壳的一件组件，§6.5）。分级模型是 ES 模块，
     由下方的 import 消费，不需要再空加载一次。 -->
__CONFIRM__
<script>__CONFIRM_JS__</script>

<!-- type="module"：页面状态模型是外部 ES 模块（config_state_model.js，无 DOM 依赖，
     用 node:test 单跑）。模块作用域默认严格模式，函数声明仍是全局可用的
     （内联 onclick 能调到 switchGroup/saveAll 等）。 -->
<script type="module">
const $ = id => document.getElementById(id);
let CONFIG = null;
let state = {};
/** 当前脏条目（路径 → {kind, from, to}），由状态模型算出。 */
const GROUPS = [
  { id:'server',   label:'服务器 / 连接', icon:'🌐' },
  { id:'role',     label:'角色与对话',   icon:'🎭' },
  { id:'models',   label:'模型引擎',     icon:'🤖' },
  { id:'intent',   label:'意图与插件',   icon:'🧩' },
  { id:'speech',   label:'语音与音频',   icon:'🔊' },
  { id:'device',   label:'认证与设备',   icon:'🔐' },
  { id:'ota',      label:'设备与固件',   icon:'📤' },
  { id:'advanced', label:'全部配置',     icon:'📦' },
];

/* ---------- 工具 ---------- */
function toast(msg, type='') {
  const t = $('toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2600);
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getPath(obj, path){ return path.split('.').reduce((o,k)=> o==null?undefined:o[k], obj); }
function setPath(obj, path, val){
  const parts = path.split('.'); let cur = obj;
  for (let i=0;i<parts.length-1;i++){ if (typeof cur[parts[i]]!=='object'||cur[parts[i]]===null) cur[parts[i]]={}; cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = val;
}
/* 敏感字段判定已移到状态模型（isSensitiveKey）——键名一把尺，
   与元信息表共用。页面不再用正则猜掩码形态（那两个显示 bug 的根因）。 */

/* ---------- 状态模型：无 DOM 依赖的纯模块（server/config/config_state_model.js） ----------
 * 敏感判定 / 初始状态 / 脏计算 / 生效分组住在那边，用 node:test 单跑。
 * 页面只做渲染 —— 把「显示值 ≠ 配置里存在的值」这条陷阱挡在状态模型里。
 */
import {
  RUNTIME_DEFAULT_PATHS, computeDirty, dirtyLabel, effectiveDefault,
  groupDirty, initialState, isSensitiveKey, placeholderText,
  setSecretInput,
} from './config_state_model.js';
// 危险分级（#30，父 spec §6）：**两份在线副本共用的唯一实现**。旧页与新设备域
// 页调同一份纯函数算级别与后果文案，确认层由壳注入（同一件组件）。
import {
  LEVEL_VISUALS, confirmButtonText, levelOf, needsVersionTyping,
  operationConsequences,
} from './config_danger_model.js';

/* 服务端给的存在信号：路径 → {configured}。密钥三态的唯一判据来源，
   绝不用正则猜掩码形态（那是两个同源显示 bug 的根因）。 */
let CONFIG_STATE = {};
/* 页面状态模型实例（初始状态 + 编辑动作）。 */
let PAGE = null;

/* 密钥控件的当前输入（路径 → 用户敲进去的新值；空串 = 保持原值）。 */
const SECRET_INPUT = {};

/* ---------- 声明式元信息表（键路径模式 → 元信息） ----------
 * 与配置键**解耦**：树上有什么键就渲染什么，未知键默认文本框；
 * 元信息只决定中文标签 / 说明 / 控件类型 / 可选项，决定不了「渲不渲染」。
 * 新增引擎块（如本机自加的 Mlx*TTS）零成本获得渲染。
 * 键格式：精确路径，或末段通配 `*.reasoning_effort`。
 */
const FIELD_META = {
  // ── 通用 ──
  'type':            { label:'类型',        hint:'引擎适配器类型，一般不用改' },
  'model_name':      { label:'模型名' },
  'model':           { label:'模型名' },
  'base_url':        { label:'接口地址' },
  'url':             { label:'接口地址' },
  'api_url':         { label:'接口地址' },
  'ws_url':          { label:'WebSocket 地址' },
  'output_dir':      { label:'输出目录' },
  'voice':           { label:'音色' },
  'voice_id':        { label:'音色 ID' },
  'speaker':         { label:'音色' },
  'speed':           { label:'语速',        control:'number', step:'0.05' },
  'temperature':     { label:'温度',        control:'number', step:'0.05' },
  'max_tokens':      { label:'最大 token 数', control:'number' },
  'top_p':           { label:'top_p',       control:'number', step:'0.05' },
  'top_k':           { label:'top_k',       control:'number' },
  'appid':           { label:'应用 ID' },
  'app_id':          { label:'应用 ID' },
  'appkey':          { label:'AppKey' },
  'cluster':         { label:'集群' },
  'region':          { label:'区域' },
  'language':        { label:'语言' },
  'tts_timeout':     { label:'TTS 超时(秒)', control:'number' },
  'model_dir':       { label:'模型目录' },
  'split_sentences': { label:'逐句合成',    hint:'开启 = 边合成边下发，首包不随回复长度增长' },
  'enable_multilingual': { label:'多语言' },
  'end_window_size': { label:'断句窗口(ms)', control:'number' },
  'response_format': { label:'响应格式' },
  'sample_rate':     { label:'采样率',      control:'number' },
  'channels':        { label:'声道数',      control:'number' },
  'frame_duration':  { label:'帧时长(ms)',  control:'number' },
  'ref_audio':       { label:'参考音频路径' },
  'ref_text':        { label:'参考音频文本', control:'textarea' },
  'reasoning_effort': {
    label: '推理级别',
    hint: '默认中：档位越高思考越久，首句语音出声越晚（实测各档位差异不大）。思考 token 计入 max_tokens，档位高时建议把 max_tokens 调大，否则可能只思考不回答。选「关闭」= 不指定档位，平台不支持真关闭时仍会思考。',
    control: 'select',
    options: [
      { value: 'low',    label: '低 · low（最快出声）' },
      { value: 'medium', label: '中 · medium（默认）' },
      { value: 'high',   label: '高 · high' },
      { value: 'xhigh',  label: '极高 · xhigh' },
      { value: 'max',    label: '最高 · max' },
      { value: 'none',   label: '关闭 · none（不指定档位，能关则关）' },
    ],
  },
};

/** 按路径取元信息：精确路径优先，再试末段通配（`*.字段名`）。 */
function fieldMeta(path){
  if (FIELD_META[path]) return FIELD_META[path];
  const bare = String(path).split('.').pop();
  if (FIELD_META['*.' + bare]) return FIELD_META['*.' + bare];
  if (FIELD_META[bare]) return FIELD_META[bare];
  return {};
}

/** 渲染一个引擎/插件块：**按配置树遍历**，再补上「运行时默认值」的注入槽。
 *
 * 两种路径合起来才是「不撒谎的完整呈现」：
 *   - 树上有的键 → 照实渲染（未知键默认文本框，孤儿现身）；
 *   - 树上有而运行时会给默认值的键（如 openai 引擎的 reasoning_effort）→
 *     显空值 + 「未设置（运行时默认 X）」+ 注入标记。
 * 两者都不把注入值写进配置树（父 spec §5.6 显式惰性）。
 */
function engineFields(obj, prefix){
  let html = treeFields(obj, prefix);
  for (const path of injectionSlots(prefix)) html += fld(path, fieldMeta(path).label);
  return html;
}

/** 该引擎块上「树上没有、但运行时会有默认值」的字段路径。
 *
 * 默认值表里存的是**模式**（`LLM.*.reasoning_effort`），这里把它实例化成
 * 具体路径（`LLM.DoubaoLLM.reasoning_effort`）：只有前缀段匹配（`*` 吃任意一段）
 * 才补槽位。
 */
function injectionSlots(prefix){
  if (!prefix) return [];
  const prefixParts = String(prefix).split('.');
  const slots = [];
  for (const pattern of Object.keys(RUNTIME_DEFAULT_PATHS)) {
    const pp = pattern.split('.');
    // 模式必须与“前缀 + 至少一个字段段”对得上。
    if (pp.length !== prefixParts.length + 1) continue;
    let ok = true;
    for (let i = 0; i < prefixParts.length; i++){
      if (pp[i] !== '*' && pp[i] !== prefixParts[i]) { ok = false; break; }
    }
    if (!ok) continue;
    const path = prefix + '.' + pp[pp.length - 1];
    if (getPath(state, path) !== undefined) continue;  // 树上已有就不补
    slots.push(path);
  }
  // 注入有条件（如 openai 型引擎才享 reasoning_effort 默认值）时，条件不成立就不补。
  const owner = getPath(state, prefix);
  const isOpenai = owner && typeof owner === 'object' && owner.type === 'openai';
  return slots.filter(p => {
    const d = effectiveDefault(p);
    if (d && d.condition === 'type=openai') return isOpenai;
    return true;
  });
}

/* ---------- API ---------- */
async function api(path, opts={}){
  const r = await fetch(path, {
    headers: {'Content-Type':'application/json', ...(opts.headers||{})},
    ...opts,
  });
  const data = await r.json().catch(()=>({ok:false,error:'响应解析失败'}));
  if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
  return data;
}

/* ---------- 初始化 ---------- */
async function init(){
  try {
    $('svcStatus').textContent = '服务运行中';
    await api('/xiaozhi/config/api/meta');
    await loadConfig();
    buildNav(); buildGroups(); markChanged();
  } catch(e){
    $('svcStatus').textContent = '服务异常: ' + e.message;
    document.querySelector('.status .dot').style.background = 'var(--err)';
    toast('加载失败: '+e.message, 'err');
  }
}

/** 拉取配置树 + 存在信号，重置为页面的初始状态。
 *
 * 注意：**不再注入引擎默认值**（旧的 applyLlmDefaults）。注入值只活在
 * 显示层（占位符「未设置（运行时默认 X）」+ 注入标记），配置树保持诚实。
 */
async function loadConfig(){
  const d = await api('/xiaozhi/config/api/full');
  CONFIG_STATE = d.config_state || {};
  CONFIG = d.config || {};
  state = deepClone(CONFIG);
  PAGE = initialState({config: CONFIG, config_state: CONFIG_STATE});
  PAGE.selection = deepClone(CONFIG.selected_module || {});
  PAGE.origSelection = deepClone(PAGE.selection);
  for (const k of Object.keys(SECRET_INPUT)) delete SECRET_INPUT[k];
  DIRTY = {};
}

function buildNav(){
  $('sidebar').innerHTML = GROUPS.map(g=>
    `<div class="navitem" data-g="${g.id}" onclick="switchGroup('${g.id}')">
      <span class="ic">${g.icon}</span><span class="lbl">${g.label}</span>
    </div>`
  ).join('');
}
function switchGroup(id){
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active', b.dataset.g===id));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('active', s.id==='g-'+id));
  if (id==='ota') refreshOta();
}

/* ---------- 设备与固件（OTA） ----------
 * 危险分级（#30，父 spec §6）在这一节落地。三个操作按 §6.2 落位表归级：
 *   重启设备（动态：固件库有更新版本 → 危险）/ 上传固件（危险）/ 删除固件
 *   （危险 + 输入固件版本号）。分级判定与后果文案来自共用的
 *   config_danger_model.js，确认层是壳注入的那一件——**旧页与新设备域页
 *   不各写一套**。§6.4 点名的三处严重度倒置在这里修复。
 */
const RUNTIME = { devices: [], firmwares: [] };

function buildOta(){
  return `
  <div class="group">
    <h2>在线设备 <span class="badge" id="otaDevCount">…</span></h2>
    <div class="desc">当前通过 WebSocket 连接到本服务器的设备。点击「重启并检查更新」，设备重启后会自动向服务器检查 OTA：若固件库中有更新版本则自动下载刷入——<b>库里确实有更高版本时，这个按钮会变成红色（危险级）</b>，因为那时它就是触发升级的扳机。<br>设备空闲时会断开连接，若列表为空，请先唤醒设备（说唤醒词或按对话键）。</div>
    <div id="otaDevices" style="padding:6px 0">加载中…</div>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn" onclick="refreshOta()">🔄 刷新</button>
    </div>
  </div>
  <div class="group">
    <h2>固件库 <span class="badge" id="otaFwCount">…</span></h2>
    <div class="desc">固件文件存放于服务器 data/bin/ 目录，命名格式 <b>型号_版本.bin</b>（如 zhengchen-minicam_2.4.3.bin）。设备重启检查更新时，若库中版本高于设备当前版本即自动升级。</div>
    <div id="otaFirmwares" style="padding:6px 0">加载中…</div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
      <input type="file" id="otaFile" accept=".bin" style="max-width:320px">
      <button class="btn danger" id="otaUploadBtn" data-danger-op="upload_firmware" data-danger-level="danger"
        title="危险：放进固件库 = 武装未来所有开机自检（ADR-0002）"
        onclick="uploadFirmware()">⛔ ⬆ 上传固件</button>
    </div>
  </div>`;
}

/** 统一页内确认层（§6.5）：分级判定 + 后果文案在这里，视觉渲染在壳里。 */
function confirmDanger(operation, context, opts){
  const o = opts || {};
  const level = levelOf(operation, context);
  return window.xzhConfirm({
    level,
    // 三载体的单一事实源：把模块里那一级读出来交给确认层，
    // 免得壳里再存一份（两份并存就是漂移的温床）。
    visual: LEVEL_VISUALS[level],
    title: o.title || '确认操作',
    consequences: operationConsequences(operation, context),
    confirmText: confirmButtonText(operation, context),
    typeToConfirm: needsVersionTyping(operation) ? {
      label: '输入固件版本号以确认',
      value: (context.firmware && context.firmware.version) || '',
      hint: '版本号在固件库列表里——这一步是故意的：删除不可逆，且不是正路运维（§6.3）。',
    } : null,
  });
}

function repaintDeviceRebootButtons(){
  document.querySelectorAll('[data-danger-op="reboot_device"]').forEach(btn => {
    const id = btn.dataset.deviceId || '';
    const device = RUNTIME.devices.find(d => d.device_id === id) || { device_id: id };
    const lvl = levelOf('reboot_device', { firmwares: RUNTIME.firmwares, device });
    const vis = LEVEL_VISUALS[lvl];
    btn.className = 'btn' + (vis.buttonClass ? ' ' + vis.buttonClass : '');
    btn.dataset.dangerLevel = lvl;
    btn.title = vis.icon
      ? vis.label + '：' + operationConsequences('reboot_device',
          { firmwares: RUNTIME.firmwares, device }).join(' ') : '';
  });
}

async function refreshOta(){
  if (!$('otaDevices')) return;
  const [dev, fw] = await Promise.all([
    api('/xiaozhi/config/api/devices').then(d => ({ok:true, data:d}), e => ({ok:false, error:e.message})),
    api('/xiaozhi/config/api/firmware').then(d => ({ok:true, data:d}), e => ({ok:false, error:e.message})),
  ]);
  if (dev.ok){
    const devices = dev.data.devices || [];
    RUNTIME.devices = devices;
    $('otaDevCount').textContent = devices.length + ' 台';
    $('otaDevices').innerHTML = devices.length ? devices.map(d => {
      const lvl = levelOf('reboot_device', { firmwares: RUNTIME.firmwares, device: d });
      const vis = LEVEL_VISUALS[lvl];
      return `
      <div class="row">
        <div class="meta">
          <div class="label">${esc(d.device_id)}</div>
          <div class="hint">IP: ${esc(d.client_ip||'-')}</div>
        </div>
        <div class="ctrl" style="display:flex;gap:10px;align-items:center">
          <span style="color:var(--ok);font-size:12px">● 在线</span>
          <button class="btn${vis.buttonClass ? ' ' + vis.buttonClass : ''}"
            data-danger-op="reboot_device" data-danger-level="${esc(lvl)}"
            data-device-id="${esc(d.device_id)}"
            onclick="rebootDevice('${esc(d.device_id)}')">${vis.icon ? vis.icon + ' ' : ''}⟳ 重启并检查更新</button>
        </div>
      </div>`;
    }).join('')
      : '<div style="color:var(--dim);padding:18px 0;font-size:13px">暂无在线设备 —— 设备空闲时会断开连接，唤醒后即会出现在这里</div>';
  } else {
    $('otaDevices').innerHTML = `<div style="color:var(--err)">加载失败: ${esc(dev.error)}</div>`;
  }
  if (fw.ok){
    const firmwares = fw.data.firmwares || [];
    RUNTIME.firmwares = firmwares;
    $('otaFwCount').textContent = firmwares.length + ' 个';
    $('otaFirmwares').innerHTML = firmwares.length ? firmwares.map(f => `
      <div class="row">
        <div class="meta">
          <div class="label">${esc(f.model||'?')} <span style="color:var(--accent)">v${esc(f.version||'?')}</span></div>
          <div class="hint">${esc(f.filename)} · ${(f.size/1048576).toFixed(2)} MB · ${new Date(f.mtime*1000).toLocaleString()}</div>
        </div>
        <div class="ctrl" style="display:flex;gap:10px;align-items:center">
          <button class="btn danger" data-danger-op="delete_firmware" data-danger-level="danger"
            onclick="deleteFirmware('${esc(f.filename)}')">⛔ 🗑 删除</button>
        </div>
      </div>`).join('')
      : '<div style="color:var(--dim);padding:18px 0;font-size:13px">固件库为空</div>';
    // 固件列表更新后设备行的级别可能变了 —— 两处都重算才不会自相矛盾。
    if (dev.ok) repaintDeviceRebootButtons();
  } else {
    $('otaFirmwares').innerHTML = `<div style="color:var(--err)">加载失败: ${esc(fw.error)}</div>`;
  }
}

async function rebootDevice(deviceId){
  const device = RUNTIME.devices.find(d => d.device_id === deviceId) || { device_id: deviceId };
  const ok = await confirmDanger('reboot_device', { firmwares: RUNTIME.firmwares, device },
    { title: `重启设备 ${deviceId}` });
  if (!ok) return;
  try {
    const r = await fetch(`/xiaozhi/ota/reboot?device_id=${encodeURIComponent(deviceId)}`, {method:'POST'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || ('HTTP '+r.status));
    toast(`已发送重启指令给 ${deviceId} ✔`, 'ok');
    setTimeout(refreshOta, 1500);
  } catch(e){
    toast('重启失败: '+e.message, 'err');
  }
}

async function uploadFirmware(){
  const inp = $('otaFile');
  if (!inp.files.length){ toast('请先选择 .bin 固件文件', 'err'); return; }
  const file = inp.files[0];
  // 目标固件版本从文件名推（后端命名契约：型号_版本.bin）。
  const m = /^(.+)_([^_]+)\.bin$/.exec(file.name);
  const pendingFirmware = { filename: file.name, model: m ? m[1] : '', version: m ? m[2] : '' };
  const ok = await confirmDanger('upload_firmware',
    { devices: RUNTIME.devices, firmwares: RUNTIME.firmwares, pendingFirmware },
    { title: `上传固件 ${file.name}` });
  if (!ok) return;
  const fd = new FormData();
  fd.append('file', file);
  const btn = $('otaUploadBtn'); btn.disabled = true; btn.textContent = '⬆ 上传中…';
  try {
    const r = await fetch('/xiaozhi/config/api/firmware/upload', {method:'POST', body: fd});
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP '+r.status));
    toast(`固件 ${d.filename} 上传成功 ✔`, 'ok');
    inp.value = '';
    refreshOta();
  } catch(e){
    toast('上传失败: '+e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '⛔ ⬆ 上传固件';
  }
}

async function deleteFirmware(filename){
  const firmware = RUNTIME.firmwares.find(f => f.filename === filename) || { filename };
  const ok = await confirmDanger('delete_firmware',
    { firmware, firmwares: RUNTIME.firmwares }, { title: `删除固件 ${filename}` });
  if (!ok) return;
  try {
    await api('/xiaozhi/config/api/firmware/delete', {method:'POST', body: JSON.stringify({filename})});
    toast('已删除 '+filename, 'ok');
    refreshOta();
  } catch(e){
    toast('删除失败: '+e.message, 'err');
  }
}

/* ---------- 引擎连通性测试 ---------- */
async function testLLM(){
  const eng = state.selected_module?.LLM;
  const cfg = getPath(state, 'LLM.'+eng) || {};
  const btn = $('llmTestBtn'), box = $('llmTestResult');
  if (!btn || !box) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ 测试中…';
  box.innerHTML = '<span>已发出请求，最长等 60 秒…</span>';
  try {
    const r = await api('/xiaozhi/config/api/test-llm', {
      method:'POST', body: JSON.stringify({engine: eng, config: cfg}),
    });
    if (!r.ok){
      box.innerHTML = `<div class="err">❌ 未接通：${esc(r.error || '测试失败')}</div>`;
      return;
    }
    const ms = v => (v === null || v === undefined) ? '—' : v + ' ms';
    const empty = r.reply ? '' :
      `<div class="warn">⚠ 只思考、没正文：思考 token 计入 max_tokens，当前上限 ${r.max_tokens ?? '未设置'}，请调大 max_tokens 或降低推理级别。</div>`;
    box.innerHTML = `
      <div class="kv">
        <span>✅ 已接通</span>
        <span>模型 ${esc(r.model || '-')}</span>
        <span>推理 ${esc(r.reasoning_effort || '-')}</span>
        <span>首字节 ${ms(r.first_chunk_ms)}</span>
        <span>首句 ${ms(r.first_content_ms)}</span>
        <span>总耗时 ${ms(r.total_ms)}</span>
        <span>思考 ${r.reasoning_chars || 0} 字</span>
      </div>
      ${r.reply ? `<div class="reply">${esc(r.reply)}</div>` : ''}${empty}`;
  } catch(e){
    box.innerHTML = `<div class="err">❌ 请求失败：${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

/* ---------- 变更跟踪 ----------
 * 脏计算全在状态模型里（server/config/config_state_model.js）。
 * 页面只负责把脏计数画到顶栏 + 保存栏，以及把脏条目分成两个生效组。
 */
let DIRTY = {};
function markChanged(){
  // 页面状态 = 配置树初值 + 当前编辑值 + 密钥输入。
  PAGE.state = state;
  PAGE.selection = currentSelection();
  DIRTY = computeDirty(PAGE);
  const n = Object.keys(DIRTY).length;
  $('dirtyChip').classList.toggle('show', n>0);
  $('dirtyCount').textContent = n;
  // 保存按钮：有改动才可用；重启按钮始终可用
  $('saveBtn').disabled = n === 0;
  $('saveInfo').textContent = n > 0 ? '保存后需重启服务使配置生效' : '暂无未保存修改';
  renderDirtyPanel();
}

/** 当前选中模块（从页面上真实的下拉值算，不依赖内存）。 */
function currentSelection(){
  const sel = {};
  for (const cat of ['VAD','ASR','LLM','VLLM','TTS','Memory']){
    const v = getPath(state, 'selected_module.'+cat);
    if (v !== undefined) sel[cat] = v;
  }
  sel.Intent = getPath(state, 'selected_module.Intent');
  return sel;
}

/** 脏列表展示：按生效性分两组（父 spec §5.4），条目永不显示密钥值。 */
function renderDirtyPanel(){
  const box = $('dirtyPanel');
  if (!box) return;
  const groups = groupDirty(DIRTY, currentSelection());
  const n = Object.keys(DIRTY).length;
  if (n === 0){ box.innerHTML = ''; return; }
  const block = (title, items) => items.length ?
    `<div style="margin-top:8px"><b>${title}</b> · ${items.length} 条
      ${items.map(it=>`<div style="color:var(--dim);font-size:12px">${esc(dirtyLabel(it))}</div>`).join('')}
     </div>` : '';
  box.innerHTML = block('重启后生效', groups.active)
    + block('仅提前配好 · 当前不生效', groups.staged);
}

/* ---------- 分组表单生成 ---------- */
function buildGroups(){
  const main = $('main');
  main.innerHTML = GROUPS.map(g=>{
    const body = g.id==='advanced' ? buildAdvanced() : (g.id==='ota' ? buildOta() : buildGroupBody(g.id));
    return `<section id="g-${g.id}">${body}</section>`;

/* 字段控件：元信息表决定控件类型，配置树决定「渲染什么」。
 *
 * 三个关键改动（父 spec §5.5 / §5.6 / §9）：
 *   1. 敏感判定看服务端存在信号（CONFIG_STATE），**不看掩码形态**；
 *   2. 未配置的字段显空值 + 占位符（注入默认值只活在显示层）；
 *   3. 密钥三态在控件上可见：未配置 / 已配置 / 待替换。
 */
function fld(path, label, hint='', opts={}){
  const meta = fieldMeta(path);
  if (meta.label) label = meta.label;
  if (meta.hint) hint = meta.hint;
  const val = getPath(state, path);
  const isSens = isSensitiveKey(path);
  // 服务端信号是密钥三态的唯一判据；信号缺失时回落看原值（不看掩码形态）。
  const sig = CONFIG_STATE[path];
  const configured = sig ? !!sig.configured : (val !== undefined && val !== null && val !== '');
  const control = meta.control || (opts.nolarge ? 'text' : null);
  let ctrl;
  if (isSens){
    const slot = SECRET_INPUT[path] || '';
    const badge = configured
      ? '<span class="badge" style="background:rgba(52,211,153,.15);color:var(--ok)">已配置</span>'
      : '<span class="badge" style="background:rgba(139,152,179,.15);color:var(--dim)">未配置</span>';
    const replacing = slot !== ''
      ? '<span class="badge secret-replace-mark" style="background:rgba(251,191,36,.18);color:var(--warn)">将替换</span>' : '';
    ctrl = `${badge}${replacing}<input type="password" data-path="${path}" data-sens="1" value="${esc(slot)}"
      autocomplete="new-password"
      placeholder="${configured ? '已配置 · 留空不变，输入新值覆盖' : '未配置 · 输入新值'}"
      title="敏感字段：留空保持原值，输入新值保存后覆盖">`;
  } else if (control === 'select' && meta.options){
    const unset = val === undefined || val === null || val === '';
    const cur = unset ? '' : String(val);
    const known = meta.options.some(o => o.value === cur);
    // 未配置 + 有运行时默认值：显式惰性 —— 选项框里不预选注入值，
    // 面一条「（未设置）」占位选项（列表里不会把这个默认值当成已选值）。
    const inj = unset ? effectiveDefault(path) : undefined;
    const list = (unset ? `<option value="" selected>${esc(placeholderText(PAGE.cfg, path))}</option>` : '')
      + meta.options.map(o=>`<option value="${esc(o.value)}" ${o.value===cur?'selected':''}>${esc(o.label)}</option>`).join('')
      + (known || unset ? '' : `<option value="${esc(cur)}" selected>${esc(cur)}</option>`);
    ctrl = `<select data-path="${path}">${list}</select>`;
    if (inj) ctrl += `<span class="badge" style="background:rgba(251,191,36,.15);color:var(--warn);margin-left:8px">注入</span>`;
  } else if (typeof val === 'boolean'){
    ctrl = `<label class="switch-row"><span class="switch"><input type="checkbox" data-path="${path}" ${val?'checked':''}><span class="sl"></span></span><span class="sw-label">${val?'开启':'关闭'}</span></label>`;
  } else if (typeof val === 'number'){
    ctrl = `<input type="number" data-path="${path}" value="${val}" ${meta.step?`step="${meta.step}"`:''}>`;
  } else if (control === 'textarea' || (typeof val === 'string' && String(val).length > 80 && !opts.nolarge)){
    ctrl = `<textarea data-path="${path}" rows="4">${esc(val ?? '')}</textarea>`;
  } else {
    // 未配置 / 未知键：默认文本框。注入默认值显示为空值 + 「未设置（运行时默认 X）」。
    const inj = meta.control === 'select' ? null : effectiveDefault(path);
    const ph = (val === undefined || val === null || val === '')
      ? placeholderText(PAGE.cfg, path) : '';
    ctrl = `<input type="text" data-path="${path}" value="${esc(val ?? '')}" placeholder="${esc(ph)}">`;
    if (inj && (val === undefined || val === null || val === '')){
      ctrl += `<span class="badge" style="background:rgba(251,191,36,.15);color:var(--warn);margin-left:8px">注入</span>`;
    }
  }
  return `<div class="row">
    <div class="meta"><div class="label">${label}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>
    <div class="ctrl">${ctrl}</div>
  </div>`;
}

/* 下拉 */
function sel(path, label, candidates, hint=''){
  const val = getPath(state, path);
  const opts = candidates.map(c=>`<option value="${esc(c)}" ${c===val?'selected':''}>${esc(c)}</option>`).join('');
  return `<div class="row">
    <div class="meta"><div class="label">${label}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>
    <div class="ctrl"><select data-path="${path}">${opts}</select></div>
  </div>`;
}

/* 列表字段 */
function listFld(path, label, hint=''){
  const items = getPath(state, path) || [];
  return `<div class="row">
    <div class="meta"><div class="label">${label}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>
    <div class="ctrl">
      <div class="keylist">
        ${items.map((it,i)=>`<div class="krow"><input type="text" data-list="${path}" data-idx="${i}" value="${esc(it)}"><button class="del" onclick="delItem('${path}',${i})">✕</button></div>`).join('')}
        <button class="addbtn" onclick="addItem('${path}')">+ 添加一项</button>
      </div>
    </div>
  </div>`;
}

/* 嵌套引擎/插件字段：**按配置树遍历**（父 spec §9 规则 1）。
 * 树上有什么键就渲染什么；未知键默认文本框 → 注入孤儿现身。
 * 数组值渲染为列表编辑，对象值折叠展开。
 */
function treeFields(obj, prefix){
  if (!obj || typeof obj!=='object') return '';
  let html = '';
  for (const [k,v] of Object.entries(obj)){
    const path = prefix ? prefix+'.'+k : k;
    if (v && typeof v==='object' && !Array.isArray(v)){
      html += `<details><summary>📂 ${esc(k)}</summary><div>${treeFields(v, path)}</div></details>`;
    } else if (Array.isArray(v)){
      html += listFld(path, fieldMeta(path).label || k);
    } else {
      html += fld(path, fieldMeta(path).label || k);
    }
  }
  return html;
}

/* SmartConfig 配网 */
function autofillWifi(){
  const el = document.getElementById('scStatus');
  // 优先用上次记住的凭据（macOS 隐私限制，命令行读不到系统 Wi-Fi）
  const last = localStorage.getItem('scWifi');
  if (last) {
    try {
      const d = JSON.parse(last);
      document.getElementById('scSsid').value = d.ssid || '';
      document.getElementById('scPass').value = d.pass || '';
      el.textContent = '已填充上次使用的 Wi-Fi';
      return;
    } catch(e) {}
  }
  el.textContent = '无历史记录（macOS 隐私限制读不到系统 Wi-Fi），请手输，下次自动记住';
}
async function sendSmartConfig(){
  const ssid = document.getElementById('scSsid').value.trim();
  const password = document.getElementById('scPass').value;
  const st = document.getElementById('scStatus');
  if (!ssid) { st.textContent = 'SSID 不能为空'; return; }
  // 警示级（§6.2）：物理世界有副作用，但重新广播一次即可覆盖。
  const okc = await confirmDanger('smartconfig', {}, { title: '开始 SmartConfig 广播' });
  if (!okc) return;
  localStorage.setItem('scWifi', JSON.stringify({ssid, pass: password}));
  const btn = document.getElementById('scBtn');
  btn.disabled = true;
  st.textContent = '广播中…（约 30 秒）';
  try {
    const r = await fetch('/xiaozhi/config/api/smartconfig', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ssid, password})
    });
    const d = await r.json();
    st.textContent = d.ok ? '📡 广播中…设备收到后自动连网并上线' : ('失败: ' + (d.error||''));
  } catch(e) { st.textContent = '请求失败: ' + e; }
  setTimeout(()=>btn.disabled=false, 5000);
}

function bindInputs(){
  document.querySelectorAll('[data-path]').forEach(el=>{
    if (el.disabled) return;
    const path = el.dataset.path;
    const evt = el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      // 敏感字段：输入不落配置树，只进密钥槽（第三态的载体）。
      // 留空 = 保持原值，不产生任何改动。
      if (el.dataset.sens==='1'){
        SECRET_INPUT[path] = el.value;
        PAGE = setSecretInput(PAGE, path, el.value);
        // 「将替换」标记就地翻转（不重建分组，否则输入框会失焦）。
        const slot = el.parentElement;
        let mark = slot && slot.querySelector('.secret-replace-mark');
        if (el.value !== ''){
          if (!mark && slot){
            mark = document.createElement('span');
            mark.className = 'badge secret-replace-mark';
            mark.style.cssText = 'background:rgba(251,191,36,.18);color:var(--warn);margin-left:6px';
            mark.textContent = '将替换';
            slot.insertBefore(mark, el);
          }
        } else if (mark){
          mark.remove();
        }
        markChanged();
        return;
      }
      let val;
      if (el.type==='checkbox') val = el.checked;
      else if (el.type==='number') val = el.value==='' ? null : Number(el.value);
      else val = el.value;
      if (el.type==='checkbox'){
        const lb = el.closest('.switch-row')?.querySelector('.sw-label');
        if (lb) lb.textContent = val ? '开启' : '关闭';
      }
      if (val === null) { const parts=path.split('.'); const p=getPath(state, parts.slice(0,-1)); delete p[parts.at(-1)]; }
      else if (val === '') { const parts=path.split('.'); const p=getPath(state, parts.slice(0,-1)); delete p[parts.at(-1)]; }
      else setPath(state, path, val);
      markChanged();
      refreshAdvanced();
      // 切换选中模块会改变引擎参数块的归属（脏分组也随选中实时重算），
      // 所以要重建当前分组——否则页面显示的仍是旧选中的引擎，与脏标记矛盾。
      if (path.startsWith('selected_module.')) rebuildGroup(currentGroup());
    });
  });
  document.querySelectorAll('[data-list]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const items = getPath(state, el.dataset.list);
      items[Number(el.dataset.idx)] = el.value;
      markChanged();
      refreshAdvanced();
    });
  });
}
function addItem(path){
  const items = getPath(state, path); items.push('');
  rebuildGroup(currentGroup());
  markChanged();
}
function delItem(path, idx){
  const items = getPath(state, path); items.splice(idx,1);
  rebuildGroup(currentGroup());
  markChanged();
}
function currentGroup(){
  const act = document.querySelector('.navitem.active');
  return act ? act.dataset.g : 'server';
}
function rebuildGroup(gid){
  const old = $('g-'+gid);
  if (!old) return;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<section id="g-${gid}">${buildGroupBody(gid)}</section>`;
  const fresh = wrap.firstChild;
  fresh.classList.add('active');
  old.replaceWith(fresh);
  bindInputs();
}
function toggleFunc(name){
  const sm = state.selected_module||{};
  const it = state.Intent?.[sm.Intent]||{};
  if (!it.functions) it.functions = [];
  const i = it.functions.indexOf(name);
  if (i>=0) it.functions.splice(i,1); else it.functions.push(name);
  rebuildGroup(currentGroup()); markChanged();
}
function addFunc(){
  const v = $('newFunc').value.trim(); if (!v) return;
  toggleFunc(v);
}

/* ---------- 保存 ----------
 * 保存协议不变：仍是端到端整树 diff（before/after）。
 * 差异是 before/after 都不再带引擎注入值（注入只活在显示层）——
 * 未配置的 reasoning_effort 不会被当作已改值写回。
 */
async function saveAll(){
  try {
    // 密钥输入：写进 after 树（服务端只认 after；掩码占位被跳过）。
    for (const [path, val] of Object.entries(SECRET_INPUT)){
      if (val !== '') setPath(state, path, val);
    }
    const r = await api('/xiaozhi/config/api/save', {method:'POST', body:JSON.stringify({before:CONFIG, after:state})});
    toast(`已保存 ${r.changed||0} 处修改`, 'ok');
    await loadConfig();
    markChanged();
    rebuildGroup(currentGroup());
    refreshAdvanced();
    toast('保存成功，点击「重启服务生效」使配置生效', 'ok');
  } catch(e){ toast('保存失败: '+e.message, 'err'); }
}
async function restartServer(){
  // 警示级（§6.2 / §6.4 修严重度倒置：红 → 琥珀）：自愈操作，单击确认。
  const ok = await confirmDanger('restart_server', {}, { title: '重启服务' });
  if (!ok) return;
  try {
    await api('/xiaozhi/config/api/restart', {method:'POST', body:'{}'});
    toast('重启指令已发出，服务恢复中…', 'ok');
    setTimeout(async ()=>{
      for (let i=0;i<20;i++){
        try { await api('/xiaozhi/config/api/meta'); toast('服务已恢复 ✔', 'ok'); break; }
        catch(e){ await new Promise(r=>setTimeout(r,3000)); }
      }
    }, 3000);
  } catch(e){ toast('重启失败: '+e.message, 'err'); }
}

/* ---------- 内联 onclick 的显式桥 ----------
 * ES 模块的顶层函数声明不会自动挂到 window，而渲染出的 HTML 里用了内联
 * onclick。这里**显式**把被引用的函数挂上去，一目了然、不靠隐式行为。
 */
Object.assign(window, {
  switchGroup, saveAll, restartServer, refreshOta, rebootDevice,
  uploadFirmware, deleteFirmware, testLLM, sendSmartConfig, autofillWifi,
  addItem, delItem, toggleFunc, addFunc,
  // 确认层与分级重画（调试/审计口径与页面同一入口）。
  confirmDanger, repaintDeviceRebootButtons, RUNTIME,
});
